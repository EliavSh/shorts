search_queries:
  - "brawl stars world record"
  - "brawl stars insane play"
  - "brawl stars first ever"
  - "brawl stars 1v3 clutch"
  - "brawl stars fastest win"
  - "brawl stars highest damage"
  - "brawl stars unbeatable"
  - "brawl stars new brawler insane"

# Each term, if present in title/description/tags, multiplies the velocity score.
rank_boost_terms:
  "world record": 1.8
  "first ever": 1.6
  "insane": 1.3
  "unbeatable": 1.4
  "no way": 1.25
  "1v3": 1.3
  "1v4": 1.4
  "clutch": 1.2
  "highest": 1.2
  "fastest": 1.2
  "broken": 1.2

# Negative signals — likely clickbait or unrelated.
rank_penalty_terms:
  "tier list": 0.5
  "tutorial": 0.5
  "guide": 0.6
  "patch notes": 0.7
  "news": 0.6
  "compilation": 0.8   # mild — we'll likely make our own
