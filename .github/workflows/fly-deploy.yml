name: Deploy to Fly.io

# Deploys the unified shorts dashboard to Fly.io.
# Runs entirely in GitHub's cloud — nothing is installed on your PC.
# The Docker image is built on Fly's remote builders (--remote-only), so the
# runner needs no Docker either.
#
# One-time setup (all via the web, no CLI):
#   1. Run the "Bootstrap Fly app" workflow once (Actions tab → Run workflow)
#      to create the app + data volume.
#   2. Set the app's runtime secrets in the Fly dashboard
#      (your app → Secrets): ANTHROPIC_API_KEY, YOUTUBE_API_KEY, etc.
#   3. Add FLY_API_TOKEN as a GitHub repo secret
#      (Settings → Secrets and variables → Actions).

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # also lets you trigger a deploy by hand

concurrency:
  group: fly-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # Retry once: the remote builder occasionally times out tearing itself
      # down ("error releasing builder: deadline_exceeded") AFTER the image is
      # built — a second run reuses cached layers and just re-attempts the
      # release. --wait-timeout gives the machine update ample time.
      - name: Deploy
        run: |
          flyctl deploy --remote-only --wait-timeout 600 --build-arg GIT_SHA="${GITHUB_SHA}" \
            || flyctl deploy --remote-only --wait-timeout 600 --build-arg GIT_SHA="${GITHUB_SHA}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
