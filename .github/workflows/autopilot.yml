name: Stocks auto-pilot tick

# Wakes the Fly machine and asks the stocks planner to render the next due
# video. The dashboard machine auto-stops when idle; this POST cold-starts it
# (auto_start_machines=true in fly.toml), the render runs on the machine that
# owns the data volume, then it idles back down.
#
# One-time setup (GitHub → Settings → Secrets and variables → Actions):
#   AUTOPILOT_URL    e.g. https://shorts-review.fly.dev/stocks/autopilot/tick
#   AUTOPILOT_TOKEN  same value you set as the Fly secret AUTOPILOT_TOKEN
#                    (fly secrets set AUTOPILOT_TOKEN=...). If the Fly secret is
#                    unset the endpoint is open and the token is ignored.
#
# Disable: comment out the `schedule:` block below (or disable this workflow in
# the Actions tab). `workflow_dispatch` lets you fire one tick by hand.

on:
  # ⏸️  PAUSED (user request) — automatic generation is OFF. No scheduled clips
  # will be produced or published. To resume, uncomment the `schedule:` block
  # below (every 4h + jitter, ~6 clips/day; keep in sync with SCHEDULE_UTC_HOURS).
  # schedule:
  #   - cron: "0 0,4,8,12,16,20 * * *"
  workflow_dispatch: {}   # still lets you fire one tick by hand if you ever want to

concurrency:
  group: stocks-autopilot
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Jitter (spread renders 3–5h apart)
        # Base cadence is every 4h; sleep a random 0–60 min so the gap between
        # consecutive renders varies 3–5h (4h ± up to 1h) instead of firing on
        # the clock. Skipped for manual workflow_dispatch runs (fire immediately).
        if: github.event_name == 'schedule'
        run: |
          mins=$(( RANDOM % 61 ))
          echo "jittering ${mins} min before the tick…"
          sleep $(( mins * 60 ))

      - name: POST autopilot tick
        env:
          AUTOPILOT_URL: ${{ secrets.AUTOPILOT_URL }}
          AUTOPILOT_TOKEN: ${{ secrets.AUTOPILOT_TOKEN }}
        run: |
          if [ -z "$AUTOPILOT_URL" ]; then
            echo "AUTOPILOT_URL secret not set — nothing to do."
            exit 1
          fi
          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            --retry 4 --retry-all-errors --retry-delay 10 --max-time 120 \
            -X POST "$AUTOPILOT_URL" \
            -H "X-Autopilot-Token: ${AUTOPILOT_TOKEN}")
          echo "HTTP $code"
          cat /tmp/resp.json || true
          echo
          # Cold-starting Fly may briefly 502/503 before the app is up; the
          # curl --retry above handles that. Treat only a final 2xx as success.
          case "$code" in
            2*) echo "tick enqueued";;
            *) echo "tick failed (HTTP $code)"; exit 1;;
          esac

      - name: Keep machine awake until the render finishes
        env:
          AUTOPILOT_URL: ${{ secrets.AUTOPILOT_URL }}
        run: |
          # Fly stops an idle machine when its proxy sees no active connections —
          # it does NOT watch CPU, so a background render gets killed mid-encode.
          # Poll the jobs endpoint every 15s (generating proxy traffic) until no
          # render is running, so the cron render can't be cut off. Bounded at
          # ~8 min so a hung render can't pin the machine forever.
          base="${AUTOPILOT_URL%/stocks/autopilot/tick}"
          jobs_url="$base/stocks/jobs"
          # Give the background job a moment to actually start.
          sleep 20
          for i in $(seq 1 32); do
            resp=$(curl -sS --max-time 20 "$jobs_url" || true)
            if ! echo "$resp" | grep -q '"running"'; then
              echo "no running render after ~$((20 + i*15))s — done."
              exit 0
            fi
            echo "render still running (~$((20 + i*15))s) — holding machine awake…"
            sleep 15
          done
          echo "keepalive window elapsed (~8 min) — leaving it to finish."
