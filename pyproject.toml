[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shorts"
version = "0.1.0"
description = "Unified Shorts content engine — gameplay (brawl) + finance (stocks)"
requires-python = ">=3.12"
dependencies = [
    # core CLI + config + http
    "typer>=0.12.5",
    "click>=8.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "httpx>=0.27",

    # storage
    "sqlmodel>=0.0.22",
    "alembic>=1.14",

    # llm / asr / tts
    "anthropic>=0.39",
    "elevenlabs>=1.7",
    "edge-tts>=7.0",
    "openai-whisper>=20231117",
    "faster-whisper>=1.0.3",

    # google api / publish
    "google-api-python-client>=2.140",
    "google-auth-oauthlib>=1.2",

    # discovery (brawl) + video download
    "yt-dlp>=2024.10.0",
    "imageio-ffmpeg>=0.5.1",
    "ffmpeg-python>=0.2.0",

    # video / image
    "moviepy>=1.0.3",
    "Pillow>=10.4",
    "matplotlib>=3.9",
    "pilmoji>=2.0",
    "python-bidi>=0.5",
    "Unidecode>=1.3",

    # market data
    "yfinance>=0.2.40",
    "finnhub-python>=2.4",

    # audio
    "pydub>=0.25.1",
    "librosa>=0.10.2",

    # robustness
    "tenacity>=9.0",
    "truststore>=0.9.2",

    # web dashboard
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
shorts = "shorts.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/shorts"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["src/shorts/pipelines/brawl/tests", "src/shorts/pipelines/stocks/tests"]
