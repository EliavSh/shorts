# Known supply-chain / sector / competitor relationships used by the topic picker
# to find a second-order story. When the primary ticker is the key, candidates
# are checked (in order) for being meaningful movers; the first one that's
# moving (and ideally in the same direction) becomes story #2.
#
# `reason` is a short Hebrew/English-agnostic phrase passed to the script writer
# so it can write the pivot line with real context.

