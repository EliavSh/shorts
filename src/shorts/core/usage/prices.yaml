# Price table — USD per unit, for cost tracking. Update when providers change pricing.

anthropic:
  # USD per 1M tokens
  claude-opus-4-7:
    input: 15.0
    output: 75.0
  claude-sonnet-4-6:
    input: 3.0
    output: 15.0

elevenlabs:
  # Roughly: Creator tier $22/mo for ~100k characters → ~$0.00022/char.
  # We bill at the marginal rate so the dashboard reflects real spend.
  per_character: 0.00022

serper:
  # $5 per 2500 queries → $0.002 per query.
  per_query: 0.002

google_cse:
  # First 100/day free, then $5 per 1000 → $0.005 per query.
  per_query: 0.005
  free_per_day: 100

pexels:
  per_query: 0.0
  free_per_month: 20000

wikimedia:
  per_query: 0.0

edge_tts:
  per_character: 0.0

youtube_data_v3:
  # 1,600 quota units per upload; 50 per privacy update. Free 10,000/day.
  # We track quota usage, not dollars.
  per_upload_units: 1600
  per_update_units: 50
  free_per_day_units: 10000
