# Fly.io deployment for the unified shorts review dashboard.
#
# No local CLI required — everything runs from GitHub Actions:
#   1. Push this repo to GitHub.
#   2. Create a Fly API token at https://fly.io/user/personal_access_tokens
#      and add it as the GitHub repo secret FLY_API_TOKEN.
#   3. Actions tab → run "Bootstrap Fly app" once (creates app + data volume).
#   4. In the Fly dashboard (your app → Secrets), set the runtime secrets:
#        ANTHROPIC_API_KEY, YOUTUBE_API_KEY,
#        BRAWL_YOUTUBE_CLIENT_SECRET_PATH=/app/secrets/brawl_client.json
#        BRAWL_YOUTUBE_TOKEN_PATH=/app/secrets/brawl_token.json
#        STOCKS_YOUTUBE_CLIENT_SECRET_PATH=/app/secrets/stocks_client.json
#        STOCKS_YOUTUBE_TOKEN_PATH=/app/secrets/stocks_token.json
#   5. Every push to main auto-deploys via .github/workflows/fly-deploy.yml.

app = "shorts-review"
primary_region = "fra"   # Frankfurt — closest to Israel; switch to "iad"/"sjc" if elsewhere

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  # YouTube uploader: non-secret paths + channel id. The credential JSON files
  # themselves are decoded from base64 Fly secrets at boot (see entrypoint.sh):
  #   fly secrets set STOCKS_YOUTUBE_CLIENT_JSON_B64=... STOCKS_YOUTUBE_TOKEN_JSON_B64=...
  STOCKS_YOUTUBE_CLIENT_SECRET_PATH = "/app/secrets/stocks_youtube_client.json"
  STOCKS_YOUTUBE_TOKEN_PATH = "/app/secrets/stocks_youtube_token.json"
  STOCKS_YOUTUBE_CHANNEL_ID = "UC20s_G6hzw5czR5q6_KualQ"

[[mounts]]
  source = "shorts_data"
  destination = "/app/data"

[http_service]
  internal_port = 8000
  force_https = true
  # Auto-stop: the machine sleeps when idle and wakes on the next request, so you
  # only pay while it's actually rendering/browsing (~1 hr/day). Renders stay
  # reliable because (a) the performance VM finishes a clip in a few minutes and
  # (b) the GitHub-Actions autopilot polls /stocks/jobs to hold the machine awake
  # for the duration of a cron render. If renders start getting cut off again,
  # flip auto_stop_machines back to "off" + min_machines_running = 1.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  # moviepy composites every frame in Python (single-threaded) at 1080x1920 — the
  # render bottleneck. Dedicated "performance" cores are much faster per-core than
  # throttled shared ones, and 4GB stops the swap thrashing that made renders take
  # an hour on shared-1x/2GB. With auto-stop above you only pay while it runs
  # (renders + browsing ≈ ~1 hr/day → roughly $1-4/mo), so we keep the fast VM.
  cpu_kind = "performance"
  cpus = 2
  memory_mb = 4096
